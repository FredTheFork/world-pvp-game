<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <base href="/">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; background: #071018; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071018; color: #e8f0f7; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #071018; }
    #unity-canvas { width: 100%; height: 100%; outline: none; background: #071018; }
    #unity-loading { position: absolute; width: min(430px, calc(100vw - 32px)); padding: 22px; border: 1px solid #284052; border-radius: 14px; background: rgba(13, 24, 34, .96); box-shadow: 0 18px 60px rgba(0,0,0,.45); }
    #unity-title { margin: 0 0 8px; font-size: 18px; font-weight: 750; letter-spacing: .04em; }
    #unity-message { margin: 0 0 14px; color: #b5c6d3; font-size: 13px; line-height: 1.45; }
    #unity-progress-track { height: 8px; overflow: hidden; border-radius: 999px; background: #203243; }
    #unity-progress { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #38c7db, #66e0b3); transition: width .18s ease; }
    #unity-error { display: none; position: fixed; inset: auto 16px 16px; z-index: 20; padding: 12px 15px; border: 1px solid #b75a62; border-radius: 10px; background: #301b20; color: #ffe4e5; font-size: 13px; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="unity-loading" role="status" aria-live="polite">
      <p id="unity-title">WORLD PvP</p>
      <p id="unity-message">Loading the browser build. First load may take a little while.</p>
      <div id="unity-progress-track"><div id="unity-progress"></div></div>
    </div>
  </div>
  <div id="unity-error" role="alert"></div>

  <script>
    var buildUrl = "Build";
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progress = document.querySelector("#unity-progress");
    var errorBox = document.querySelector("#unity-error");

    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    if ({{{ USE_THREADS }}} && !window.crossOriginIsolated) {
      document.querySelector("#unity-message").textContent =
        "This Cesium Web build needs a cross-origin isolated page. The host must send COOP: same-origin and COEP: require-corp.";
    }

    var loaderScript = document.createElement("script");
    loaderScript.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    loaderScript.onload = function () {
      createUnityInstance(canvas, config, function (value) {
        progress.style.width = Math.round(value * 100) + "%";
      }).then(function (instance) {
        window.worldPvpUnityInstance = instance;
        loading.style.display = "none";
        canvas.focus();
        // The C# scene may have called Start before the loader promise resolved. Only now
        // is SendMessage available for the per-tab Authentication profile handshake.
        instance.SendMessage("PhaseOneWorldSystems", "OnBrowserRuntimeReady", "");
      }).catch(function (message) {
        showError("Unity failed to start. Check browser support, COOP/COEP headers, Brotli Content-Encoding, and the Console.");
      });
    };
    loaderScript.onerror = function () {
      showError("The Unity WebGL loader could not be downloaded. Check the deployment path and static-file configuration.");
    };
    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
